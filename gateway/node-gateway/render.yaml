# render.yaml — Node Gateway
#
# This file auto-deploys the gateway on every push to main.
# Render reads it and redeploys the wood-furni service.
services:
  - type: web
    name: wood-furni
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    healthCheckInterval: 15
    # Render Free Tier cold start ~2-3 min
    startupTimeout: 300
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
