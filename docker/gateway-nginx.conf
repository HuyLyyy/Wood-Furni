# =============================================================================
# WOODFURNI Gateway — Nginx Reverse Proxy
# Included from /etc/nginx/http.d/*.conf (inside http{} block)
# Proxies:
#   /api/*       → backend Spring Boot (internal)
#   /socket.io/* → Node.js Socket.IO server (internal:3001)
#   /internal/*  → Node.js notification routes (internal:3001)
#   /health      → Node.js health check (internal:3001)
# =============================================================================

server {
    listen 3000 default_server;
    server_name _;

    client_max_body_size 10m;

    # ---- Proxy: /api/* → Spring Boot Backend ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ---- Serve uploaded files (uploaded to /app/uploads in the backend container) ----
    # Backend StorageController saves files to /app/uploads and serves them at
    # /api/v1/storage/uploads/{filename}. We expose them at /uploads/ for convenience.
    location /uploads/ {
        # Strip /uploads prefix and forward to backend's storage endpoint
        rewrite ^/uploads/(.*) /api/v1/storage/uploads/$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Don't buffer — stream file content back to client
        proxy_buffering off;
    }

    # ---- Proxy: /socket.io/* → Node.js Socket.IO ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Proxy: /internal/* → Node.js ----
    location /internal/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Proxy: /health → Node.js ----
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
