# render.yaml — Wood-Furni infrastructure (backend + gateway)
#
# Two web services on Render Free Tier, both auto-deploying on push to main.
# - furniture-api   : Spring Boot backend (Java + MongoDB)
# - wood-furni      : Node.js gateway (Express + Socket.IO)
#
# Render treats each service as an independent web app. The gateway
# forwards /api/v1/* to the backend's internal hostname.
#
# IMPORTANT: On Free Tier, you can only have ONE web service per
# blueprint unless they're on separate accounts/workspaces. If your
# Render account only allows one service, use the EMBED mode below.

services:
  - type: web
    name: furniture-api
    env: docker
    dockerfilePath: backend/furniture-api/Dockerfile
    healthCheckPath: /api/v1/actuator/health
    healthCheckInterval: 15
    # First cold start pulls Maven deps + builds Docker (~6-10 min).
    startupTimeout: 900
    autoDeploy: true
    region: singapore
    envVars:
      - key: JAVA_OPTS
        value: >-
          -XX:+UseContainerSupport
          -XX:MaxRAMPercentage=75.0
          -Dserver.port=${PORT:-8080}

  - type: web
    name: wood-furni
    env: node
    rootDir: gateway/node-gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    healthCheckInterval: 15
    startupTimeout: 300
    autoDeploy: true
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      # BACKEND_BASE_URL must match the furniture-api service hostname
      # below. Render exposes the internal hostname only between
      # services in the same account, so we use the public URL here.
      - key: BACKEND_BASE_URL
        value: https://furniture-api.onrender.com
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8083
