# =============================================================================
# WOODFURNI - Spring Boot Application Configuration
# =============================================================================

spring:
  application:
    name: furniture-api

    # MongoDB Configuration
  data:
    mongodb:
      # MongoDB URI - override with MONGODB_URI environment variable
      # Default: mongodb://localhost:27017/woodfurni
      uri: ${MONGODB_URI:mongodb://localhost:27017/woodfurni}
      auto-index-creation: true
      # Database name (extracted from URI if not specified)
      database: ${MONGODB_DATABASE:woodfurni}

  # Mail Configuration (Gmail SMTP for OTP emails)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  error:
    include-message: always
    include-binding-errors: always

# =============================================================================
# JWT Configuration
# =============================================================================
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-must-be-at-least-32-characters-long-for-hs256}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}   # 1 hour in milliseconds
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

# =============================================================================
# Swagger / OpenAPI Configuration
# =============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level:
    root: INFO
    com.woodfurni: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# =============================================================================
# Actuator Configuration
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# =============================================================================
# Node Gateway client (realtime notifications)
# =============================================================================
# Spring Boot forwards domain events (order.created, order.status.updated,
# inventory.low_stock) to the Node.js gateway via these HTTP endpoints.
gateway:
  base-url: ${GATEWAY_BASE_URL:http://localhost:3000}
  internal-secret: ${GATEWAY_INTERNAL_SECRET:internal-woodfurni-shared-secret-change-me}
  enabled: ${GATEWAY_ENABLED:true}
  timeout:
    connect-ms: 1500
    read-ms: 2000

# =============================================================================
# File Upload Configuration
# =============================================================================
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:/app/uploads}
  max-file-mb: ${STORAGE_MAX_FILE_MB:5}

# =============================================================================
# Mail / OTP Configuration
# =============================================================================
mail:
  from: ${MAIL_FROM:no-reply@woodfurni.vn}
  from-name: ${MAIL_FROM_NAME:WOODFURNI}
  otp:
    ttl-seconds: 300            # 5 minutes
    cooldown-seconds: 60        # minimum gap between resend
    max-attempts: 5             # wrong code attempts before lockout
    code-length: 6
    # dev-otp-code: when set, EmailOtpService returns this code instead of
    # sending email. Useful for local dev / E2E tests without SMTP.
    dev-otp-code: ${DEV_OTP_CODE:}

# =============================================================================
# Shipping Configuration
# =============================================================================
#
# Fee formula (see ShippingService.calculateFee):
#
#   distanceKm <= base-radius-km  →  fee = base-fee
#   distanceKm >  base-radius-km  →  fee = base-fee
#                                          + ceil(distanceKm - base-radius-km) * surcharge-per-km
#
# For cities OTHER THAN "Hồ Chí Minh", the distance table is not consulted;
# out-of-province-distance-km is used as the fallback distance.
#
shipping:
  base-fee: ${SHIPPING_BASE_FEE:100000}
  base-radius-km: ${SHIPPING_BASE_RADIUS_KM:10}
  surcharge-per-km: ${SHIPPING_SURCHARGE_PER_KM:6000}
  out-of-province-distance-km: ${SHIPPING_OUT_OF_PROVINCE_DISTANCE_KM:60}

