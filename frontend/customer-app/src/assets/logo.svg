<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Circular background: wood brown -->
  <circle cx="40" cy="40" r="40" fill="#6b4f2a"/>
  <!-- Tree trunk -->
  <rect x="36" y="42" width="8" height="14" rx="2" fill="#c79a4d"/>
  <!-- Tree foliage layers -->
  <polygon points="40,18 58,44 22,44" fill="#c79a4d"/>
  <polygon points="40,28 54,48 26,48" fill="#e0c08a"/>
  <polygon points="40,38 50,52 30,52" fill="#c79a4d"/>
  <!-- Wood grain lines on trunk -->
  <line x1="37" y1="45" x2="37" y2="54" stroke="#6b4f2a" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="45" x2="40" y2="55" stroke="#6b4f2a" stroke-width="1" opacity="0.4"/>
  <line x1="43" y1="45" x2="43" y2="54" stroke="#6b4f2a" stroke-width="1" opacity="0.4"/>
</svg>
