name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
